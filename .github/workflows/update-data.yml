name: Update games.json

on:
  schedule:
    # Twice a day, in UTC. 11:05 = 12:05 CET / 13:05 CEST, 23:05 = 00:05 CET / 01:05 CEST,
    # so in Dutch time each run lands just after the start of its half of the day
    # (before noon / after noon), which is what the website checks for.
    - cron: "5 11,23 * * *"
  workflow_dispatch: # manual "Run workflow" button
    inputs:
      delay:
        description: "Seconds to wait between pages"
        required: false
        default: "1"

permissions:
  contents: write

concurrency:
  group: update-games
  cancel-in-progress: true

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch latest catalog
        env:
          DELAY: ${{ inputs.delay }}
        run: python scripts/fetch_games.py --delay "${DELAY:-1}"
      - name: Commit games.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add games.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: update games.json"
            git push
          fi
